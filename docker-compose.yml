services:
  streamlit:
    build: .
    ports:
      - "8502:8501"
    environment:
      - ENVIRONMENT=demo
      - ENABLE_MOCK_PROVIDER=true
    volumes:
      - sash-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build: .
    working_dir: /app
    command: ["python", "-m", "uvicorn", "src.api.server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=demo
      - ENABLE_MOCK_PROVIDER=true
      - PYTHONPATH=/app
    depends_on:
      - streamlit

volumes:
  sash-data:
